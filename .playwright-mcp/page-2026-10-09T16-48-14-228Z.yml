    - generic [ref=e20]:
      - paragraph [ref=e21]: TrustedBenefitHub ("we", "us", or "our") operates the website TrustedBenefitHub.com (the "Site"). This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our Site or submit a request for insurance information. Please read it carefully. By using the Site, you consent to the practices described here.
      - heading "1. Information We Collect" [level=2] [ref=e22]
      - paragraph [ref=e23]: "We collect information you voluntarily provide and information collected automatically:"
      - list [ref=e24]:
        - listitem [ref=e25]:
          - strong [ref=e26]: "Information you provide:"
          - text: first name, last name, age, telephone number, state, ZIP code, and any other details you submit through our quote or contact forms.
        - listitem [ref=e27]:
          - strong [ref=e28]: "Automatically collected data:"
          - text: IP address, browser type, device information, pages visited, referring URLs, and similar analytics data collected via cookies and comparable technologies.
      - heading "2. How We Use Your Information" [level=2] [ref=e29]
      - paragraph [ref=e30]: "We use the information we collect to:"
      - list [ref=e31]:
        - listitem [ref=e32]: Connect you with licensed insurance agents and providers who can offer Final Expense, Medicare, and related insurance products;
        - listitem [ref=e33]: Respond to your inquiries and provide the quotes or information you requested;
        - listitem [ref=e34]: Contact you by telephone, SMS/text message, email, or automated technology (including autodialers and pre-recorded messages), consistent with the consent you provide;
        - listitem [ref=e35]: Improve our Site, services, and marketing; and
        - listitem [ref=e36]: Comply with legal obligations and prevent fraud or misuse.
      - heading "3. Consent to Be Contacted (TCPA)" [level=2] [ref=e37]
      - paragraph [ref=e38]:
        - text: By submitting your information and checking the consent box on our form, you expressly consent to be contacted by TrustedBenefitHub and its marketing partners and licensed insurance agents at the telephone number you provided, including through the use of automatic telephone dialing systems, artificial or pre-recorded voice messages, and SMS text messages, even if your number is on a state or federal Do-Not-Call list. This consent is
        - strong [ref=e39]: not a condition of purchasing any goods or services
        - text: . Standard message and data rates may apply. You may revoke consent at any time (see Section 8).
      - heading "4. How We Share Your Information" [level=2] [ref=e40]
      - paragraph [ref=e41]: "We may share your information with:"
      - list [ref=e42]:
        - listitem [ref=e43]: Licensed insurance agents, brokers, carriers, and marketing partners who provide the requested insurance quotes and services;
        - listitem [ref=e44]: Service providers that support our operations (e.g., hosting, analytics, call-center services);
        - listitem [ref=e45]: Legal or governmental authorities when required by law, subpoena, or to protect our rights; and
        - listitem [ref=e46]: A successor entity in the event of a merger, acquisition, or sale of assets.
      - paragraph [ref=e47]: We do not sell your personal information to unrelated third parties for their own independent marketing outside the scope described above.
      - heading "5. Cookies & Tracking Technologies" [level=2] [ref=e48]
      - paragraph [ref=e49]: We use cookies, web beacons, and similar technologies to operate the Site, remember your preferences, measure performance, and support advertising. You can control cookies through your browser settings; disabling them may affect Site functionality.
      - heading "6. Data Security" [level=2] [ref=e50]
      - paragraph [ref=e51]: We implement reasonable administrative, technical, and physical safeguards designed to protect your information. However, no method of transmission over the Internet or electronic storage is 100% secure, and we cannot guarantee absolute security.
      - heading "7. Your Privacy Rights" [level=2] [ref=e52]
      - paragraph [ref=e53]: Depending on your state of residence (for example, under the California Consumer Privacy Act), you may have the right to access, correct, delete, or restrict the use of your personal information, and to opt out of certain sharing. To exercise these rights, contact us using the details below.
      - heading "8. Opt-Out & Do-Not-Call" [level=2] [ref=e54]
      - paragraph [ref=e55]:
        - text: You may opt out of marketing communications at any time by replying "STOP" to any text message, asking a representative to place you on our internal Do-Not-Call list, or emailing us at
        - link "support@trustedbenefithub.com" [ref=e56] [cursor=pointer]:
