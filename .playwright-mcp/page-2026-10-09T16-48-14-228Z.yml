        - text: . Please allow a reasonable time for your request to take effect.
      - heading "9. Third-Party Links" [level=2] [ref=e57]
      - paragraph [ref=e58]: Our Site may contain links to third-party websites. We are not responsible for the privacy practices or content of those sites. We encourage you to review their privacy policies.
      - heading "10. Children's Privacy" [level=2] [ref=e59]
      - paragraph [ref=e60]: Our Site is not directed to individuals under the age of 18, and we do not knowingly collect personal information from children.
      - heading "11. Changes to This Policy" [level=2] [ref=e61]
      - paragraph [ref=e62]: We may update this Privacy Policy from time to time. Changes are effective when posted on this page with a revised "Last updated" date. Your continued use of the Site constitutes acceptance of the updated policy.
